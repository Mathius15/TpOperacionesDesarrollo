name: CI Back

# Correr solo cuando cambian archivos de la carpeta back/.
# Si no hay cambios en back/, este workflow ni se dispara.
# workflow_dispatch permite correrlo a mano (util si solo cambia el workflow).
on:
  push:
    branches: ['**']
    paths:
      - 'back/**'
      - '.github/workflows/ci-back.yml'
      - 'codecov.yml'
  pull_request:
    branches: ['**']
    paths:
      - 'back/**'
      - '.github/workflows/ci-back.yml'
      - 'codecov.yml'
  workflow_dispatch:

permissions:
  contents: read

# Si se pushea varias veces al mismo branch, cancela el run anterior.
concurrency:
  group: ci-back-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-back:
    name: Lint del backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: back

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: back/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Correr ESLint
        run: npm run lint:ci

  test-back:
    name: Tests del backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: back

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: back/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Correr los tests con cobertura
        run: npm run test:cov

      - name: Subir cobertura a Codecov
        uses: codecov/codecov-action@v7
        with:
          files: back/coverage/lcov.info
          flags: backend
          name: backend
          fail_ci_if_error: false #Si codecov falla, el CI no se pone rojo


  publish-back:
      name: Publicar imagen del backend
      needs: [lint-back, test-back]
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      runs-on: ubuntu-latest

      steps:
        - uses: actions/checkout@v4

        - name: Login en Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

        - name: Configurar Buildx
          uses: docker/setup-buildx-action@v3

        - name: Build y push del backend
          uses: docker/build-push-action@v6
          with:
            context: ./back
            file: ./back/Dockerfile
            push: true
            platforms: linux/amd64
            tags: |
              mathius15/tandil-back:latest
              mathius15/tandil-back:${{ github.sha }}

        - name: Disparar deploy en Render
          run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_BACK"
          env:
            RENDER_DEPLOY_HOOK_BACK: ${{ secrets.RENDER_DEPLOY_HOOK_BACK }}