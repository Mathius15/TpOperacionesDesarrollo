# Un Secret guarda datos sensibles (usuarios, passwords, tokens).
# Se usa igual que un ConfigMap, pero pensado para credenciales.
#
# "stringData" recibe el texto plano y Kubernetes lo codifica en base64 solo.
# Si usaramos "data", habria que pasar los valores ya en base64.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: tandil
type: Opaque
stringData:
  DB_USER: postgres
  DB_PASSWORD: postgres
  DB_NAME: tandildb
